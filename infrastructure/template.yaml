AWSTemplateFormatVersion: '2010-09-09'
Description: Lambda versionada con configuracion S3 y secreto en Secrets Manager.

Parameters:
  CodeS3Bucket:
    Type: String
  CodeS3Key:
    Type: String
  ConfigS3Bucket:
    Type: String
  ConfigS3Key:
    Type: String
  SecretArn:
    Type: String
  FunctionName:
    Type: String
    Default: lambda-cicd-demo

Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${FunctionName}-execution
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: lambda-runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Join
                  - ''
                  - - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:'
                    - !Sub '/aws/lambda/${FunctionName}:*'
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${ConfigS3Bucket}/${ConfigS3Key}
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref SecretArn

  LambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref FunctionName
      Runtime: python3.12
      Handler: app.handler.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 10
      MemorySize: 256
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      Environment:
        Variables:
          CONFIG_BUCKET: !Ref ConfigS3Bucket
          CONFIG_KEY: !Ref ConfigS3Key
          SECRET_ARN: !Ref SecretArn

Outputs:
  FunctionName:
    Value: !Ref LambdaFunction
  FunctionArn:
    Value: !GetAtt LambdaFunction.Arn
  ConfigLocation:
    Value: !Sub s3://${ConfigS3Bucket}/${ConfigS3Key}
