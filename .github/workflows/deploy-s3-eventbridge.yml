name: Publish Lambda artifacts through S3 EventBridge

on:
  push:
    tags:
      - 'event-v*'

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
  SECRET_ARN: ${{ vars.SECRET_ARN }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packaging tools
        run: python -m pip install -r requirements.txt

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Extract and validate version
        id: version
        run: |
          version="${GITHUB_REF_NAME#event-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build code artifact
        run: ./scripts/package.sh "${{ steps.version.outputs.version }}"

      - name: Upload code before configuration
        run: |
          version="${{ steps.version.outputs.version }}"
          aws s3 cp "build/lambda-${version}.zip" \
            "s3://${ARTIFACT_BUCKET}/code/${version}.zip" --sse AES256

      - name: Upload configuration and emit EventBridge event
        run: ./scripts/upload-config.sh "${{ steps.version.outputs.version }}"

      - name: Report event-driven publication
        run: |
          echo "S3 config upload emitted the EventBridge event for config/${{ steps.version.outputs.version }}.json"
          echo "The pre-existing EventBridge rule invokes the Lambda asynchronously."
