name: Deploy Lambda with Function URL

on:
  push:
    tags:
      - 'url-v*'

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
  STACK_NAME: ${{ vars.STACK_NAME_FUNCTION_URL || 'lambda-cicd-function-url' }}
  FUNCTION_NAME: ${{ vars.FUNCTION_NAME_FUNCTION_URL || 'lambda-cicd-function-url' }}
  SECRET_ARN: ${{ vars.SECRET_ARN }}
  GITHUB_ROLE_ARN: ${{ vars.GITHUB_ROLE_ARN }}
  FUNCTION_URL_AUTH_TYPE: ${{ vars.FUNCTION_URL_AUTH_TYPE || 'AWS_IAM' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging tools
        run: python -m pip install -r requirements.txt
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Extract and validate version
        id: version
        run: |
          version="${GITHUB_REF_NAME#url-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build code artifact
        run: ./scripts/package.sh "${{ steps.version.outputs.version }}"
      - name: Upload code and configuration
        run: |
          version="${{ steps.version.outputs.version }}"
          aws s3 cp "build/lambda-${version}.zip" \
            "s3://${ARTIFACT_BUCKET}/code/${version}.zip" --sse AES256
          ./scripts/upload-config.sh "$version"
      - name: Deploy Lambda and Function URL
        run: |
          version="${{ steps.version.outputs.version }}"
          aws cloudformation deploy \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --template-file infrastructure/template-function-url.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              CodeS3Bucket="$ARTIFACT_BUCKET" \
              CodeS3Key="code/${version}.zip" \
              ConfigS3Bucket="$ARTIFACT_BUCKET" \
              ConfigS3Key="config/${version}.json" \
              SecretArn="$SECRET_ARN" \
              FunctionName="$FUNCTION_NAME" \
              FunctionUrlAuthType="$FUNCTION_URL_AUTH_TYPE"
      - name: Read outputs
        id: stack
        run: |
          function_name="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs[?OutputKey==`FunctionName`].OutputValue' \
            --output text)"
          endpoint=""
          if [[ "$FUNCTION_URL_AUTH_TYPE" == "NONE" ]]; then
            endpoint="$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query 'Stacks[0].Outputs[?OutputKey==`FunctionUrl`].OutputValue' \
              --output text)"
          fi
          echo "function_name=$function_name" >> "$GITHUB_OUTPUT"
          echo "endpoint=$endpoint" >> "$GITHUB_OUTPUT"
      - name: Safe smoke test
        env:
          FUNCTION_NAME: ${{ steps.stack.outputs.function_name }}
          API_URL: ${{ steps.stack.outputs.endpoint }}
          FUNCTION_URL_AUTH_TYPE: ${{ env.FUNCTION_URL_AUTH_TYPE }}
        run: ./scripts/smoke-test.sh
